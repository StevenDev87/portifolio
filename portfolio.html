<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>politfolio</title>
    <a href="index.html">Back to Home</a>
</head>
<body>
    <style>
        .portfolio{
  background:#ffffff;
  padding:80px 5%;
  color:#121512;
}
.portfolio-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}
.portfolio-header h2{
  font-size:28px;
  font-weight:700;
}
.portfolio-header h2 span{
  color:#8FD14F;
}
.portfolio-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px 30px;
}
.work-item img{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:12px;
  filter:grayscale(100%);
  transition:0.4s;
  background:#eee;
}
.work-item:hover img{
  filter:grayscale(0%);
}
.tag{
  display:inline-block;
  background:#8FD14F;
  color:#121512;
  font-size:10px;
  padding:5px 10px;
  border-radius:20px;
  font-weight:600;
  margin:14px 0 8px;
}
.work-item h3{
  font-size:18px;
  font-weight:700;
}
.divider-dark{
  color:#ddd;
  font-size:10px;
  letter-spacing:2px;
  margin-top:60px;
  overflow:hidden;
  white-space:nowrap;
}

@media(max-width:900px){
  .portfolio-grid{
    grid-template-columns:1fr;
  }
}
    </style>
<section class="portfolio">
  <div class="portfolio-header">
    <div>
      <p class="small-green">Works</p>
      <h2>My Works <span>Portfolio.</span></h2>
    </div>
    <button class="btn-outline-dark">⊕ View All Services</button>
  </div>

  <div class="portfolio-grid">
    <div class="work-item">
      <img src="https://images.unsplash.com/photo-1581291518633-83b4ebd1d83e?w=600" alt="TechNova">
      <span class="tag">Branding & Identity</span>
      <h3>TechNova Inc</h3>
    </div>

    <div class="work-item">
      <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?w=600" alt="LuxWear">
      <span class="tag">UI/UX Design</span>
      <h3>LuxWear</h3>
    </div>

    <div class="work-item">
      <img src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=600" alt="InnovateNow">
      <span class="tag">Illustrations</span>
      <h3>InnovateNow</h3>
    </div>

    <div class="work-item">
      <img src="https://images.unsplash.com/photo-1583524505974-6facd53f4597?w=600" alt="FitFlex">
      <span class="tag">Marketing Design</span>
      <h3>FitFlex</h3>
    </div>
  </div>

  <div class="divider-dark">xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</div>
</section>
    
</body>
</html>
